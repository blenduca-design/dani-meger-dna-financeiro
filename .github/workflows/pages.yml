name: Deploy GitHub Pages

# Substitui o pipeline legado (Jekyll interno) por um deploy explícito via
# Actions: o site é 100% estático (ver .nojekyll), então o "build" aqui é
# só empacotar a raiz do repositório e publicar — sem a instabilidade e os
# erros silenciosos ("Page build failed", sem log) do builder clássico.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
